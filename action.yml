name: 'Todo Sync Flow'
description: 'Converts TODO/FIXME/HACK comments into GitHub issues with full lifecycle: create, track, close.'
author: 'Stylus Nexus'

branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  github_token:
    description: 'GitHub token. Needs issues:write; also contents:write when insert_urls is true'
    required: true

  extra_identifiers:
    description: |
      JSON array of additional identifiers to detect.
      Each entry: { "name": "SRD-VIOLATION", "label": "compliance", "priority": "high" }
      Priority is optional, defaults to "normal".
    required: false
    default: '[]'

  insert_urls:
    description: 'Write-back. When true, commits the issue URL into each new TODO line, on the branch that triggered the run only, staging only those files. Needs contents:write. Set false for read-only'
    required: false
    default: 'true'

  close_on_remove:
    description: 'When true, closes the linked GitHub issue when a TODO line is deleted'
    required: false
    default: 'true'

  assignees:
    description: 'Comma-separated GitHub usernames to assign to created issues'
    required: false
    default: ''

  extra_labels:
    description: 'Comma-separated additional labels to apply to every created issue'
    required: false
    default: ''

  milestone:
    description: 'Milestone number (integer) to assign to created issues'
    required: false
    default: ''

  full_scan:
    description: 'Scan all files instead of just the diff. Creates issues for every unlinked TODO.'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
